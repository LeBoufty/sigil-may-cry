[project]
name = "sigilmc"
version = "0.2.0"
description = "Dessinateur de sigils pour les Hermétistes pressés"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Pauline J." }
]
dependencies = [
    "cairocffi==1.7.1",
    "CairoSVG==2.9.1",
    "cffi==2.1.1",
    "cssselect2==0.10.1",
    "defusedxml==0.7.1",
    "drawsvg==2.4.2",
    "ImageIO==2.38.1",
    "imageio-ffmpeg==0.8.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pwkit==1.3.1",
    "pycparser==3.12",
    "tinycss2==1.5.1",
    "webencodings==0.6.1"
]

[project.scripts]
sigilmc = "sigilmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
